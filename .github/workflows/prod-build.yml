name: Build UI Artifact

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string
      tag_name:
        description: 'GitHub release tag'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string
      tag_name:
        description: 'GitHub release tag'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build & Upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package and upload STARTcloud UI artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf "startcloud-ui-${{ inputs.version }}.tar.gz" -C dist .
          node -e "const html = require('fs').readFileSync('dist/index.html', 'utf8'); const match = html.match(/<script>([\s\S]*?)<\/script>/); if (!match) { process.exit(1); } process.stdout.write(require('crypto').createHash('sha256').update(match[1]).digest('base64'));" > "startcloud-ui-${{ inputs.version }}.prepaint.sha256"
          gh release upload "${{ inputs.tag_name }}" "startcloud-ui-${{ inputs.version }}.tar.gz" "startcloud-ui-${{ inputs.version }}.prepaint.sha256" --clobber
