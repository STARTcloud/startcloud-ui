name: CI

on:
  workflow_call:
  pull_request:
    branches: ['main']

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

# The release-please PR changes only CHANGELOG.md, package.json and the
# manifest; every line of code in it reached main through a push that this
# workflow already tested whole, so the PR's own run proves nothing new and
# its jobs skip on a release-please branch. A dependabot PR, or any other,
# still runs the full suite.
jobs:
  lint-and-format:
    name: Lint & Format
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npx prettier --check .

  tests:
    name: Tests
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    uses: ./.github/workflows/tests.yml
    with:
      class: shared-ui
      unit: npm run test:unit

  build:
    name: Build
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  codeql-analysis:
    name: CodeQL
    needs: [lint-and-format, tests, build]
    uses: ./.github/workflows/codeql.yml
