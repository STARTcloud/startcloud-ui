<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          var session = JSON.parse(localStorage.getItem('user') || 'null');
          var site = document.documentElement.getAttribute('data-brand-theme');
          var siteDefault = site === 'light' || site === 'dark' ? site : 'auto';
          var preference =
            (session && session.preferred_theme) || localStorage.getItem('theme') || siteDefault;
          var resolved =
            preference === 'auto'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference;
          document.documentElement.setAttribute('data-bs-theme', resolved);
          var lang = localStorage.getItem('language');
          if (lang) {
            document.documentElement.lang = lang;
          }
          var motion = localStorage.getItem('motion');
          if (motion === 'reduce') {
            document.documentElement.setAttribute('data-motion', 'reduce');
          }
          var packName = localStorage.getItem('pack') || '';
          var packs = JSON.parse(localStorage.getItem('packs') || '[]');
          var pack = /^[a-z0-9-]+$/.test(packName)
            ? packs.filter(function (entry) {
                return entry && entry.name === packName;
              })[0]
            : null;
          if (
            pack &&
            /^\/(?![/\\])/.test(pack.css || '') &&
            document.documentElement.getAttribute('data-brand') !== pack.name
          ) {
            document.documentElement.setAttribute('data-brand', pack.name);
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.id = 'brand-pack';
            link.href = pack.css;
            document.head.appendChild(link);
          }
        } catch (error) {
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      })();
    </script>
    <link rel="icon" href="/brand/startcloud/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/brand/startcloud/mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signing in… — STARTcloud</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/callback.jsx"></script>
  </body>
</html>
