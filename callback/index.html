<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          var read = function (key) {
            try {
              return JSON.parse(localStorage.getItem(key) || 'null');
            } catch (error) {
              return null;
            }
          };
          var stored = read('user') || read('account');
          var account = null;
          if (stored && typeof stored === 'object') {
            account = {
              mode: stored.preferred_mode,
              theme: stored.preferred_theme,
              motion: stored.preferred_motion,
              language: stored.preferred_language,
            };
          } else {
            for (var index = 0; index < localStorage.length; index += 1) {
              var name = localStorage.key(index) || '';
              if (name.slice(-12) === '.preferences') {
                var cached = read(name);
                if (cached && typeof cached === 'object') {
                  account = {
                    mode: cached.mode === undefined ? null : cached.mode,
                    theme: cached.theme === undefined ? null : cached.theme,
                    motion: cached.motion === undefined ? null : cached.motion,
                    language: cached.language === undefined ? null : cached.language,
                  };
                }
                break;
              }
            }
          }
          var member = function (field) {
            if (account && account[field] !== undefined) {
              return typeof account[field] === 'string' ? account[field] : '';
            }
            return localStorage.getItem(field) || '';
          };
          var mode = member('mode');
          var resolved =
            mode === 'light' || mode === 'dark'
              ? mode
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-bs-theme', resolved);
          var lang = member('language') || localStorage.getItem('language');
          if (lang) {
            document.documentElement.lang = lang;
          }
          if (member('motion') === 'reduce') {
            document.documentElement.setAttribute('data-motion', 'reduce');
          }
          var themeName = member('theme');
          var themes = JSON.parse(localStorage.getItem('themes') || '[]');
          var theme = /^[a-z0-9-]+$/.test(themeName)
            ? themes.filter(function (entry) {
                return entry && entry.name === themeName;
              })[0]
            : null;
          if (
            theme &&
            /^\/(?![/\\])/.test(theme.css || '') &&
            document.documentElement.getAttribute('data-brand') !== theme.name
          ) {
            document.documentElement.setAttribute('data-brand', theme.name);
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.id = 'brand-theme';
            link.href = theme.css;
            document.head.appendChild(link);
          }
        } catch (error) {
          document.documentElement.setAttribute(
            'data-bs-theme',
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          );
        }
      })();
    </script>
    <link rel="icon" href="/brand/startcloud/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/brand/startcloud/mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signing in… — STARTcloud</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/callback.jsx"></script>
  </body>
</html>
