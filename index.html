<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          var read = function (key) {
            try {
              return JSON.parse(localStorage.getItem(key) || 'null');
            } catch (error) {
              return null;
            }
          };
          var stored = read('user') || read('account');
          var account = null;
          if (stored && typeof stored === 'object') {
            account = {
              theme: stored.preferred_theme,
              pack: stored.preferred_pack,
              motion: stored.preferred_motion,
              language: stored.preferred_language,
            };
          } else {
            for (var index = 0; index < localStorage.length; index += 1) {
              var name = localStorage.key(index) || '';
              if (name.slice(-12) === '.preferences') {
                var cached = read(name);
                if (cached && typeof cached === 'object') {
                  account = {
                    theme: cached.theme === undefined ? null : cached.theme,
                    pack: cached.pack === undefined ? null : cached.pack,
                    motion: cached.motion === undefined ? null : cached.motion,
                    language: cached.language === undefined ? null : cached.language,
                  };
                }
                break;
              }
            }
          }
          var member = function (field) {
            if (account && account[field] !== undefined) {
              return typeof account[field] === 'string' ? account[field] : '';
            }
            return localStorage.getItem(field) || '';
          };
          var site = document.documentElement.getAttribute('data-brand-theme');
          var siteDefault = site === 'light' || site === 'dark' ? site : 'auto';
          var chosen = member('theme');
          var preference =
            chosen === 'light' || chosen === 'dark' || chosen === 'auto' ? chosen : siteDefault;
          var resolved =
            preference === 'auto'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference;
          document.documentElement.setAttribute('data-bs-theme', resolved);
          var lang = member('language') || localStorage.getItem('language');
          if (lang) {
            document.documentElement.lang = lang;
          }
          if (member('motion') === 'reduce') {
            document.documentElement.setAttribute('data-motion', 'reduce');
          }
          var packName = member('pack');
          var packs = JSON.parse(localStorage.getItem('packs') || '[]');
          var pack = /^[a-z0-9-]+$/.test(packName)
            ? packs.filter(function (entry) {
                return entry && entry.name === packName;
              })[0]
            : null;
          if (
            pack &&
            /^\/(?![/\\])/.test(pack.css || '') &&
            document.documentElement.getAttribute('data-brand') !== pack.name
          ) {
            document.documentElement.setAttribute('data-brand', pack.name);
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.id = 'brand-pack';
            link.href = pack.css;
            document.head.appendChild(link);
          }
        } catch (error) {
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      })();
    </script>
    <link rel="icon" href="/brand/startcloud/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/brand/startcloud/mark.svg" type="image/svg+xml" id="favicon" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/brand/startcloud/mark-192.png" />
    <meta name="theme-color" content="#0d6efd" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="STARTcloud" />
    <title>STARTcloud</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/index.jsx"></script>
  </body>
</html>
