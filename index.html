<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          var site = document.documentElement.getAttribute('data-brand-theme');
          var siteDefault = site === 'light' || site === 'dark' ? site : 'auto';
          var preference = localStorage.getItem('theme') || siteDefault;
          var resolved =
            preference === 'auto'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference;
          document.documentElement.setAttribute('data-bs-theme', resolved);
          var lang = localStorage.getItem('i18nextLng');
          if (lang) {
            document.documentElement.lang = lang;
          }
        } catch (error) {
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      })();
    </script>
    <link rel="icon" href="/startcloud.svg" id="favicon" />
    <link rel="preload" href="/fonts/ibm-plex-sans-400.ttf" as="font" type="font/ttf" crossorigin />
    <link
      rel="preload"
      href="/fonts/source-serif-4-500.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="STARTcloud" />
    <title>STARTcloud</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/index.jsx"></script>
  </body>
</html>
