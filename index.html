<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          var site = document.documentElement.getAttribute('data-brand-theme');
          var siteDefault = site === 'light' || site === 'dark' ? site : 'auto';
          var preference = localStorage.getItem('theme') || siteDefault;
          var resolved =
            preference === 'auto'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference;
          document.documentElement.setAttribute('data-bs-theme', resolved);
          var lang = localStorage.getItem('language');
          if (lang) {
            document.documentElement.lang = lang;
          }
          var packName = localStorage.getItem('pack') || '';
          var packs = JSON.parse(localStorage.getItem('packs') || '[]');
          var pack = /^[a-z0-9-]+$/.test(packName)
            ? packs.filter(function (entry) {
                return entry && entry.name === packName;
              })[0]
            : null;
          if (
            pack &&
            /^\/(?![/\\])/.test(pack.css || '') &&
            document.documentElement.getAttribute('data-brand') !== pack.name
          ) {
            document.documentElement.setAttribute('data-brand', pack.name);
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.id = 'brand-pack';
            link.href = pack.css;
            document.head.appendChild(link);
          }
        } catch (error) {
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      })();
    </script>
    <link rel="icon" href="/brand/startcloud/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/brand/startcloud/mark.svg" type="image/svg+xml" id="favicon" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/brand/startcloud/mark-192.png" />
    <meta name="theme-color" content="#0d6efd" />
    <link rel="preload" href="/fonts/ibm-plex-sans-400.ttf" as="font" type="font/ttf" crossorigin />
    <link
      rel="preload"
      href="/fonts/source-serif-4-500.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="STARTcloud" />
    <title>STARTcloud</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/index.jsx"></script>
  </body>
</html>
