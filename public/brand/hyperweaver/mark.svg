<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hyperweaver">
  <style>
    .brand-mark-root { color-scheme: light dark; }
    .hw-frame { stroke: #111111; stroke: light-dark(#111111, #f4f6f8); }
    .hw-shadow { fill: #111111; fill: light-dark(#111111, #f4f6f8); }
  </style>
  <defs>
    <linearGradient id="hwRib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a33"/>
      <stop offset="1" stop-color="#ff6600"/>
    </linearGradient>
    <linearGradient id="hwRibH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a33"/>
      <stop offset="1" stop-color="#ff6600"/>
    </linearGradient>
  </defs>
  <g class="brand-mark-root" transform="translate(41 41) scale(1.6796875)">
    <g class="hw-frame" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <rect x="30" y="28" width="48" height="200" rx="10" fill="url(#hwRib)"/>
      <rect x="30" y="104" width="196" height="48" rx="10" fill="url(#hwRibH)"/>
      <rect class="hw-shadow" x="164" y="106" width="16" height="44" rx="6" opacity="0.24" stroke="none"/>
      <rect x="178" y="28" width="48" height="200" rx="10" fill="url(#hwRib)"/>
      <rect class="hw-shadow" x="32" y="152" width="44" height="16" rx="6" opacity="0.20" stroke="none"/>
    </g>
  </g>
</svg>
